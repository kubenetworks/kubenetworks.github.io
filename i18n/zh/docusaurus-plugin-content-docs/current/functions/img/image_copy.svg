<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -10 800 390" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <defs>
    <marker id="ai" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
    <marker id="aig" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4CAF50"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">KubeVPN Image Copy</text>

  <!-- Source Registry -->
  <rect x="20" y="55" width="220" height="180" rx="10" fill="#E8F4FD" stroke="#4A90D9" stroke-width="2"/>
  <text x="130" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Source Registry</text>
  <text x="130" y="96" text-anchor="middle" font-size="10" fill="#666">ghcr.io</text>

  <rect x="40" y="108" width="180" height="28" rx="4" fill="#fff" stroke="#4A90D9" stroke-width="1"/>
  <text x="130" y="127" text-anchor="middle" font-size="10" font-family="monospace" fill="#333">kubenetworks/kubevpn</text>

  <rect x="60" y="146" width="60" height="25" rx="3" fill="#BBDEFB" stroke="#1976D2" stroke-width="1"/>
  <text x="90" y="163" text-anchor="middle" font-size="9" fill="#333">Layer 1</text>

  <rect x="130" y="146" width="60" height="25" rx="3" fill="#BBDEFB" stroke="#1976D2" stroke-width="1"/>
  <text x="160" y="163" text-anchor="middle" font-size="9" fill="#333">Layer 2</text>

  <rect x="60" y="178" width="60" height="25" rx="3" fill="#BBDEFB" stroke="#1976D2" stroke-width="1"/>
  <text x="90" y="195" text-anchor="middle" font-size="9" fill="#333">Layer 3</text>

  <rect x="130" y="178" width="60" height="25" rx="3" fill="#C8E6C9" stroke="#388E3C" stroke-width="1"/>
  <text x="160" y="195" text-anchor="middle" font-size="9" fill="#333">Manifest</text>

  <!-- kubevpn image copy -->
  <rect x="280" y="55" width="240" height="65" rx="8" fill="#FFF8E1" stroke="#F5A623" stroke-width="2"/>
  <text x="400" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#E65100">kubevpn image copy</text>
  <text x="400" y="96" text-anchor="middle" font-size="10" fill="#666">regclient — only copies missing layers</text>
  <text x="400" y="112" text-anchor="middle" font-size="9" fill="#888">progress display with per-blob bars</text>

  <!-- Auth: two methods -->
  <rect x="270" y="138" width="260" height="100" rx="6" fill="#FAFAFA" stroke="#DDD" stroke-width="1.5"/>
  <text x="400" y="156" text-anchor="middle" font-size="11" font-weight="bold" fill="#555">Authentication</text>

  <!-- Method 1: DSN inline -->
  <rect x="282" y="164" width="236" height="28" rx="4" fill="#E8F4FD" stroke="#4A90D9" stroke-width="1.5"/>
  <text x="400" y="183" text-anchor="middle" font-size="10" fill="#333">DSN inline: user:pass@registry/repo:tag</text>

  <!-- Method 2: Docker creds -->
  <rect x="282" y="198" width="236" height="28" rx="4" fill="#FCE4EC" stroke="#E91E63" stroke-width="1.5"/>
  <text x="400" y="217" text-anchor="middle" font-size="10" fill="#333">Docker: ~/.docker/config.json</text>

  <!-- Arrow: auth to copy -->
  <line x1="400" y1="136" x2="400" y2="125" stroke="#F5A623" stroke-width="1.5" marker-end="url(#ai)"/>

  <!-- Auto TLS -->
  <rect x="280" y="255" width="240" height="68" rx="6" fill="#E8F5E9" stroke="#4CAF50" stroke-width="1.5"/>
  <text x="400" y="275" text-anchor="middle" font-size="11" font-weight="bold" fill="#1B5E20">Auto TLS Detection</text>
  <text x="400" y="293" text-anchor="middle" font-size="9" fill="#666">1. Try HTTPS (443) — self-signed OK</text>
  <text x="400" y="307" text-anchor="middle" font-size="9" fill="#666">2. Fallback HTTP (80) — plain HTTP OK</text>
  <text x="400" y="319" text-anchor="middle" font-size="9" fill="#888">No --insecure needed</text>

  <!-- Arrow: TLS to auth -->
  <line x1="400" y1="253" x2="400" y2="240" stroke="#4CAF50" stroke-width="1.5" marker-end="url(#aig)"/>

  <!-- Target Registry -->
  <rect x="560" y="55" width="220" height="180" rx="10" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2"/>
  <text x="670" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Target Registry</text>
  <text x="670" y="96" text-anchor="middle" font-size="10" fill="#666">registry.example.org</text>

  <rect x="580" y="108" width="180" height="28" rx="4" fill="#fff" stroke="#4CAF50" stroke-width="1"/>
  <text x="670" y="127" text-anchor="middle" font-size="10" font-family="monospace" fill="#333">kubevpn/kubevpn</text>

  <rect x="600" y="146" width="60" height="25" rx="3" fill="#E0E0E0" stroke="#9E9E9E" stroke-width="1"/>
  <text x="630" y="163" text-anchor="middle" font-size="9" fill="#888">Layer 1</text>

  <rect x="670" y="146" width="60" height="25" rx="3" fill="#C8E6C9" stroke="#4CAF50" stroke-width="1.5"/>
  <text x="700" y="163" text-anchor="middle" font-size="9" fill="#333">Layer 2</text>

  <rect x="600" y="178" width="60" height="25" rx="3" fill="#C8E6C9" stroke="#4CAF50" stroke-width="1.5"/>
  <text x="630" y="195" text-anchor="middle" font-size="9" fill="#333">Layer 3</text>

  <rect x="670" y="178" width="60" height="25" rx="3" fill="#C8E6C9" stroke="#4CAF50" stroke-width="1.5"/>
  <text x="700" y="195" text-anchor="middle" font-size="9" fill="#333">Manifest</text>

  <!-- Arrows: pull / push -->
  <line x1="240" y1="85" x2="275" y2="85" stroke="#4A90D9" stroke-width="2" marker-end="url(#ai)"/>
  <text x="258" y="78" font-size="9" fill="#4A90D9">pull</text>

  <line x1="520" y1="85" x2="555" y2="85" stroke="#4CAF50" stroke-width="2" marker-end="url(#aig)"/>
  <text x="538" y="78" font-size="9" fill="#4CAF50">push</text>

  <!-- Legend -->
  <rect x="580" y="248" width="200" height="40" rx="4" fill="#FAFAFA" stroke="#DDD" stroke-width="1"/>
  <rect x="595" y="258" width="12" height="12" fill="#E0E0E0" stroke="#9E9E9E" stroke-width="1"/>
  <text x="615" y="269" font-size="10" fill="#666">Exists (skipped)</text>
  <rect x="700" y="258" width="12" height="12" fill="#C8E6C9" stroke="#4CAF50" stroke-width="1"/>
  <text x="720" y="269" font-size="10" fill="#666">Copied</text>

  <!-- Bottom example -->
  <text x="400" y="348" text-anchor="middle" font-size="10" font-family="monospace" fill="#555">kubevpn image copy admin:secret@src.local:5000/app:v1 admin:secret@dst.com/app:v1</text>
  <text x="400" y="365" text-anchor="middle" font-size="10" fill="#888">DSN inline credentials + auto TLS — no docker login or --insecure needed</text>
</svg>
